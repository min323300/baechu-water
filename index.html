<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5D3A">
<title>배추밭 물관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#EEF2EC; --card:#FFFFFF; --ink:#1D2B1F; --sub:#5E6D60; --line:#D6DDD3; --brand:#2F5D3A;
  --red:#D64545; --blue:#2F7FD8; --purple:#7C4DDB; --magenta:#C81E8C; --orange:#E8892B; --yellow:#D9A90F; --green:#2E9E5B;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{--bg:#141A15;--card:#1E261F;--ink:#E7EEE6;--sub:#9AAA9B;--line:#2F3A30;--brand:#7FBF8C}}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}

header{display:flex;align-items:center;gap:8px;margin-bottom:14px}
header h1{font-size:1.25rem;margin:0;flex:1;font-weight:800;letter-spacing:-.02em}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:44px;height:44px;font-size:1.1rem}

.datebar{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.datebar input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0 12px;font:inherit;font-weight:600}
.today-btn{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-weight:700}
.past-note{background:#FFF4D6;color:#6B5310;border-radius:10px;padding:8px 12px;font-size:.9rem;margin-bottom:12px}

.overview{background:var(--card);border-radius:16px;padding:14px;margin-bottom:14px;border:1px solid var(--line)}
.ov-bar{display:flex;height:22px;border-radius:11px;overflow:hidden;gap:2px}
.ov-bar span{flex:1}
.ov-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.88rem;color:var(--sub)}
.ov-legend b{color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.card{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px 12px 18px;min-height:140px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--st)}
.card.live{border-color:var(--st);background:color-mix(in srgb,var(--st) 7%,var(--card))}
.card h3{margin:0 0 6px;font-size:1.08rem;font-weight:800}
.card .st{font-size:.9rem;font-weight:700;color:var(--st);margin-bottom:6px}
.card .rl{font-size:.86rem;color:var(--sub);line-height:1.55}
.remain{font-size:1.55rem;font-weight:800;color:var(--st);letter-spacing:-.02em;line-height:1.2}
.remain small{font-size:.85rem;font-weight:700;margin-left:2px}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 6px}
.pbar i{display:block;height:100%;background:var(--st);transition:width .4s}
.card.over{animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--magenta) 45%,transparent)}}
@media (prefers-reduced-motion:reduce){.card.over{animation:none}}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;transform:translateY(100%);transition:transform .22s ease;z-index:11}
.sheet.open{transform:none}
.sheet h2{margin:0 0 4px;font-size:1.3rem}
.sheet .memo{color:var(--sub);font-size:.9rem;margin-bottom:12px}
.lbl{font-size:.9rem;font-weight:700;color:var(--sub);margin:4px 0 6px}
.tabs,.segs,.chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button,.segs button,.chips button{flex:1;min-width:70px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:700}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.segs button[aria-pressed=true],.chips button[aria-pressed=true]{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent);color:var(--blue)}
.segs button:disabled{opacity:.4;text-decoration:line-through}
.progress{height:12px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 14px}
.progress i{display:block;height:100%;background:var(--green);transition:width .3s}
.big{width:100%;min-height:64px;border:0;border-radius:16px;font-size:1.2rem;font-weight:800;color:#fff;margin-bottom:10px}
.big.start{background:var(--blue)} .big.stop{background:var(--red)}
.big:disabled{background:var(--line);color:var(--sub)}
.live-box{--st:var(--blue);border:2px solid var(--st);border-radius:16px;padding:16px;margin-bottom:10px;background:color-mix(in srgb,var(--st) 8%,transparent)}
.live-box .remain{font-size:2.3rem}
.live-box .rl{color:var(--sub);font-size:.95rem}
.ext{display:flex;gap:6px;margin-bottom:10px}
.ext button{flex:1;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:700}
.done-box{border-radius:12px;padding:12px;margin-bottom:10px;font-weight:700;color:var(--green);background:color-mix(in srgb,var(--green) 12%,transparent)}
.recs{list-style:none;padding:0;margin:6px 0 0}
.recs li{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:10px 0;font-size:.95rem}
.recs li span{flex:1}
.recs small{color:var(--sub)}
.del{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;font-size:.85rem;color:var(--red)}
.close{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:transparent;margin-top:12px;font-weight:700}

.table-wrap{overflow-x:auto;margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:480px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--sub);font-weight:600}
h4{margin:22px 0 0;font-size:1rem}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%}
.toast.show{opacity:1}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--sub);line-height:1.6}
.setup input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:transparent;color:var(--ink);font:inherit;margin:8px 0}
.loading .grid,.loading .sheet{opacity:.6;pointer-events:none}
.badge{position:absolute;top:10px;right:10px;background:#B42318;color:#fff;font-size:.78rem;font-weight:800;border-radius:999px;padding:3px 8px}
.issues-top{background:color-mix(in srgb,#B42318 8%,var(--card));border:1.5px solid #B42318;border-radius:14px;padding:12px 14px;margin-bottom:14px}
.issues-top h5{margin:0 0 6px;font-size:.98rem;color:#B42318}
.issues-top button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:6px 0;font-size:.92rem;border-top:1px solid color-mix(in srgb,#B42318 20%,transparent)}
.issues-top button:first-of-type{border-top:0}
.issue-box{border-top:2px solid var(--line);margin-top:16px;padding-top:14px}
.issue-box h3{margin:0 0 8px;font-size:1.05rem}
.itypes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.itypes button{min-height:44px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:700}
.itypes button[aria-pressed=true]{border-color:#B42318;background:color-mix(in srgb,#B42318 12%,transparent);color:#B42318}
.issue-box textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;background:transparent;color:var(--ink);resize:vertical;margin-bottom:8px}
.big.warn{background:#B42318}
.ilist{list-style:none;padding:0;margin:8px 0 0}
.ilist li{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.ilist li span{flex:1;font-size:.93rem;line-height:1.45}
.ilist li.done span{color:var(--sub);text-decoration:line-through}
.ilist .ok{border:1.5px solid var(--green);color:var(--green);background:transparent;border-radius:8px;padding:6px 10px;font-weight:700;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1>🌱 배추밭 물관리</h1>
    <button class="icon-btn" id="btnReload" aria-label="새로고침">⟳</button>
    <button class="icon-btn" id="btnSetup" aria-label="연결 설정">⚙</button>
  </header>

  <div class="datebar">
    <button class="icon-btn" id="prev" aria-label="전날">‹</button>
    <input type="date" id="date" aria-label="날짜 선택">
    <button class="icon-btn" id="next" aria-label="다음날">›</button>
    <button class="today-btn" id="goToday">오늘</button>
  </div>

  <div id="pastNote" class="past-note" hidden>지난 날짜 기록을 보는 중입니다. 급수 시작·종료는 오늘 날짜에서만 할 수 있어요.</div>
  <div id="content"><div class="empty">불러오는 중…</div></div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ 설정 ============ */
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbzP3xI7pKoKbo8DnYFpeZt-Vqn-yuOo6piJ9BwiDxUmdnh1zauImYAfuJexM94JkoSz/exec';
const SOON_MIN = 10;               // 종료 몇 분 전부터 '곧 종료' 색으로 바꿀지
const PLAN_OPTIONS = [120, 150, 180]; // 급수시간 선택 버튼(분)

const COLORS = { none:'var(--red)', run:'var(--blue)', soon:'var(--purple)', over:'var(--magenta)', part:'var(--orange)', one:'var(--yellow)', done:'var(--green)' };
const LABELS = { none:'미급수', run:'급수 중', soon:'곧 종료', over:'시간 초과', part:'부분 완료', one:'1회 완료', done:'전체 완료' };
const ISSUE_TYPES = ['스프링클러 막힘', '호스 터짐', '누수', '수압 약함', '기타'];
const SEGS = [ { key:'전체', label:'전체 100%' }, { key:'앞쪽 절반', label:'앞쪽 절반' }, { key:'나머지 절반', label:'나머지 절반' } ];

let api = (()=>{ try{ return localStorage.getItem('waterApi') || DEFAULT_API; }catch(e){ return DEFAULT_API; } })();
let state = { date:'', today:'', fields:[], records:[], issues:[] };
let sel = { field:null, round:1, seg:null, plan:null, itype:null, itext:'' };
const alerted = new Set();
const $ = id => document.getElementById(id);

/* ============ 서버 통신 ============ */
async function call(params = {}) {
  if (!api) { renderSetup(); return null; }
  const q = new URLSearchParams({ date: $('date').value || '', ...params, t: Date.now() });
  document.body.classList.add('loading');
  try {
    const res = await fetch(api + '?' + q.toString());
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '알 수 없는 오류');
    state = data; state.issues = data.issues || [];
    if (!$('date').value) $('date').value = data.date;
    if (data.msg) toast(data.msg);
    render();
    return data;
  } catch (e) {
    toast('불러오지 못했습니다: ' + e.message);
    return null;
  } finally {
    document.body.classList.remove('loading');
  }
}

/* ============ 시간 계산 ============ */
const toMin = s => { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60; };
const hhmm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
const dur = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}시간 ${r}분` : `${h}시간`) : `${r}분`; };

function liveInfo(rec) {
  let el = nowMin() - toMin(rec.start);
  if (el < 0) el += 1440;
  const plan = rec.plan || 150;
  const rem = plan - el;
  return { el, plan, rem, pct: Math.min(100, el / plan * 100), endAt: hhmm(toMin(rec.start) + plan),
           st: rem <= 0 ? 'over' : rem <= SOON_MIN ? 'soon' : 'run' };
}

/* ============ 상태 계산 ============ */
function roundInfo(field, round) {
  const recs = state.records.filter(r => r.field === field.name && r.round === round);
  const running = recs.find(r => !r.end);
  const doneSegs = new Set(recs.filter(r => r.end).map(r => r.seg));
  const pct = doneSegs.has('전체') ? 100 : (doneSegs.has('앞쪽 절반') ? 50 : 0) + (doneSegs.has('나머지 절반') ? 50 : 0);
  return { round, recs, running, doneSegs, pct: Math.min(pct, 100) };
}
function fieldStatus(field) {
  const infos = [];
  for (let r = 1; r <= field.rounds; r++) infos.push(roundInfo(field, r));
  const runInfo = infos.find(i => i.running);
  let st = 'none', live = null;
  const done = infos.filter(i => i.pct >= 100).length;
  if (runInfo && state.date === state.today) { live = { ...liveInfo(runInfo.running), info: runInfo }; st = live.st; }
  else if (runInfo) st = 'run';
  else if (done >= field.rounds) st = 'done';
  else if (infos.some(i => i.pct > 0 && i.pct < 100)) st = 'part';
  else if (done >= 1) st = 'one';
  return { st, infos, live };
}
function roundLine(i) {
  if (!i.recs.length) return i.round + '차 미시작';
  const times = i.recs.map(r => r.start + '~' + (r.end || '진행')).join(', ');
  return i.round + '차 ' + (i.pct < 100 ? i.pct + '% · ' : '') + times;
}

const openIssues = name => state.issues.filter(i => !i.done && (!name || i.field === name));
const issueLine = i => `${i.date === state.today ? '' : i.date.slice(5).replace('-', '/') + ' '}${i.time} ${i.type}${i.text ? ' · ' + i.text : ''}`;

/* ============ 알림 ============ */
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.25, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t + .3);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .3);
    });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 400]); } catch (e) {}
}
function checkAlerts(stats) {
  stats.forEach(s => {
    if (!s.live) return;
    const id = s.live.info.running.id;
    if (s.live.st === 'soon' && !alerted.has(id + 's')) { alerted.add(id + 's'); toast(`${s.f.name} ${SOON_MIN}분 안에 급수 종료 예정입니다.`); }
    if (s.live.st === 'over' && !alerted.has(id + 'o')) { alerted.add(id + 'o'); beep(); toast(`⏰ ${s.f.name} 급수 시간이 끝났습니다. 밸브를 잠가 주세요.`); }
  });
}

/* ============ 화면 ============ */
function render() {
  const isToday = state.date === state.today;
  $('pastNote').hidden = isToday;
  if (!state.fields.length) {
    $('content').innerHTML = '<div class="empty">밭 목록이 비어 있습니다.<br>구글시트의 「밭목록」 시트에 밭 이름을 추가해 주세요.</div>';
    return;
  }
  const stats = state.fields.map(f => ({ f, ...fieldStatus(f) }));
  const count = k => stats.filter(s => s.st === k).length;
  checkAlerts(stats);

  let html = `<section class="overview" aria-label="현황">
    <div class="ov-bar">${stats.map(s => `<span style="background:${COLORS[s.st]}" title="${esc(s.f.name)}"></span>`).join('')}</div>
    <div class="ov-legend">${Object.keys(LABELS).filter(k => count(k) || ['none','run','done'].includes(k)).map(k => `<span><i class="dot" style="background:${COLORS[k]}"></i>${LABELS[k]} <b>${count(k)}</b></span>`).join('')}</div>
  </section>`;
  const oi = openIssues();
  if (oi.length) {
    html += `<section class="issues-top"><h5>⚠ 해결 안 된 문제 ${oi.length}건</h5>${oi.map(i => `<button data-f="${esc(i.field)}"><b>${esc(i.field)}</b> · ${esc(issueLine(i))}</button>`).join('')}</section>`;
  }
  html += `<div class="grid">`;

  stats.forEach((s, idx) => {
    let body;
    if (s.live) {
      const L = s.live;
      body = `<div class="st">● ${LABELS[s.st]} · ${L.info.round}차${L.info.running.seg !== '전체' ? ' ' + esc(L.info.running.seg) : ''}</div>
        <div class="remain">${L.rem > 0 ? dur(L.rem) + '<small>남음</small>' : dur(-L.rem) + '<small>초과</small>'}</div>
        <div class="pbar"><i style="width:${L.pct}%"></i></div>
        <div class="rl">${L.info.running.start} 시작 → ${L.endAt} 종료</div>`;
    } else {
      body = `<div class="st">● ${LABELS[s.st]}</div><div class="rl">${s.infos.map(i => esc(roundLine(i))).join('<br>')}</div>`;
    }
    html += `<button class="card ${s.live ? 'live' : ''} ${s.st === 'over' ? 'over' : ''}" style="--st:${COLORS[s.st]}" data-i="${idx}">${openIssues(s.f.name).length ? `<span class="badge">⚠ ${openIssues(s.f.name).length}</span>` : ''}<h3>${esc(s.f.name)}</h3>${body}</button>`;
  });
  html += '</div>';

  const recs = [...state.records].sort((a, b) => a.start.localeCompare(b.start));
  html += `<h4>${state.date} 급수 기록 (${recs.length}건)</h4>`;
  html += recs.length ? `<div class="table-wrap"><table>
    <thead><tr><th>밭</th><th>회차</th><th>구역</th><th>시작</th><th>종료</th><th>실제</th><th>목표</th></tr></thead>
    <tbody>${recs.map(r => `<tr><td>${esc(r.field)}</td><td>${r.round}차</td><td>${esc(r.seg)}</td><td>${r.start}</td><td>${r.end || '진행 중'}</td><td>${r.mins === '' ? '-' : dur(r.mins)}</td><td>${dur(r.plan)}</td></tr>`).join('')}</tbody>
  </table></div>` : '<div class="empty" style="margin-top:8px">이 날짜에는 기록이 없습니다.</div>';

  $('content').innerHTML = html;
  document.querySelectorAll('.card').forEach(c => c.onclick = () => openField(stats[+c.dataset.i].f));
  document.querySelectorAll('.issues-top [data-f]').forEach(b => b.onclick = () => {
    const f = state.fields.find(x => x.name === b.dataset.f); if (f) openField(f, true);
  });
  // 메모 입력 중에는 화면을 다시 그리지 않음 (쓰던 글자 보호)
  const typing = document.activeElement && document.activeElement.id === 'itext';
  if (sel.field && $('sheet').classList.contains('open') && !typing) renderSheet();
}

function openField(f, toIssue) {
  sel.field = f.name;
  const { infos } = fieldStatus(f);
  const idx = infos.findIndex(i => i.running || i.pct < 100);
  sel.round = idx >= 0 ? idx + 1 : 1;
  sel.seg = null;
  sel.plan = f.planMin;
  sel.itype = null; sel.itext = '';
  $('sheet').classList.add('open');
  $('sheetBg').style.display = 'block';
  renderSheet();
  if (toIssue && $('issueBox')) $('issueBox').scrollIntoView({ block: 'start' });
}
function closeSheet() {
  sel.field = null;
  $('sheet').classList.remove('open');
  $('sheetBg').style.display = 'none';
}

function renderSheet() {
  const f = state.fields.find(x => x.name === sel.field);
  if (!f) return closeSheet();
  const isToday = state.date === state.today;
  const info = roundInfo(f, sel.round);
  const segs = f.split ? SEGS : [SEGS[0]];
  const segDone = k => k === '전체' ? info.doneSegs.size > 0 : info.doneSegs.has(k) || info.doneSegs.has('전체');
  if (!sel.seg || segDone(sel.seg)) sel.seg = (segs.find(s => !segDone(s.key)) || segs[0]).key;
  const plans = [...new Set([...PLAN_OPTIONS, f.planMin])].sort((a, b) => a - b);

  let h = `<h2>${esc(f.name)}</h2>
    <div class="memo">기본 급수 ${dur(f.planMin)} · 하루 ${f.rounds}회${f.split ? ' · 분할 급수 가능' : ''}${f.memo ? ' · ' + esc(f.memo) : ''}</div>
    <div class="tabs">${Array.from({ length: f.rounds }, (_, i) => `<button data-r="${i + 1}" aria-pressed="${sel.round === i + 1}">${i + 1}차 급수</button>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;font-weight:700"><span>${sel.round}차 진행률</span><span>${info.pct}%</span></div>
    <div class="progress"><i style="width:${info.pct}%"></i></div>`;

  if (info.running && isToday) {
    const L = liveInfo(info.running);
    h += `<div class="live-box" style="--st:${COLORS[L.st]}">
        <div class="lbl" style="color:var(--st)">● ${LABELS[L.st]}${info.running.seg !== '전체' ? ' · ' + esc(info.running.seg) : ''}</div>
        <div class="remain">${L.rem > 0 ? dur(L.rem) + '<small>남음</small>' : dur(-L.rem) + '<small>초과</small>'}</div>
        <div class="pbar"><i style="width:${L.pct}%"></i></div>
        <div class="rl">${info.running.start} 시작 · ${dur(L.el)} 경과 · 목표 ${dur(L.plan)} · ${L.endAt} 종료 예정</div>
      </div>
      <div class="ext"><button data-ext="30">+30분 연장</button><button data-ext="-30" ${L.plan <= 40 ? 'disabled' : ''}>30분 줄이기</button></div>
      <button class="big stop" id="btnEnd">급수 종료</button>`;
  } else if (info.running) {
    h += `<div class="done-box" style="color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,transparent)">${info.running.start} 시작 후 종료 기록이 없습니다.</div>`;
  } else if (info.pct >= 100) {
    h += `<div class="done-box">✔ ${sel.round}차 급수 완료</div>`;
  } else {
    if (f.split) h += `<div class="lbl">급수 구역</div><div class="segs">${segs.map(s => `<button data-s="${s.key}" aria-pressed="${sel.seg === s.key}" ${segDone(s.key) ? 'disabled' : ''}>${s.label}</button>`).join('')}</div>`;
    h += `<div class="lbl">급수 시간</div><div class="chips">${plans.map(p => `<button data-p="${p}" aria-pressed="${sel.plan === p}">${dur(p)}</button>`).join('')}</div>
      <button class="big start" id="btnStart" ${isToday ? '' : 'disabled'}>${f.split && sel.seg !== '전체' ? esc(sel.seg) + ' ' : ''}${dur(sel.plan)} 급수 시작</button>`;
  }

  if (info.recs.length) {
    h += `<ul class="recs">${info.recs.map(r => `<li><span><b>${r.start} ~ ${r.end || '진행 중'}</b> <small>${esc(r.seg)} · 목표 ${dur(r.plan)}${r.mins !== '' ? ' · 실제 ' + dur(r.mins) : ''}</small></span>
      <button class="del" data-id="${r.id}">삭제</button></li>`).join('')}</ul>`;
  }
  const fi = state.issues.filter(i => i.field === f.name);
  h += `<div class="issue-box" id="issueBox"><h3>⚠ 문제 메모</h3>
    <div class="itypes">${ISSUE_TYPES.map(t => `<button data-it="${t}" aria-pressed="${sel.itype === t}">${t}</button>`).join('')}</div>
    <textarea id="itext" placeholder="위치나 상황을 적어주세요 (예: 세 번째 줄 끝 헤드 막힘)">${esc(sel.itext)}</textarea>
    <button class="big warn" id="btnIssue" ${sel.itype || sel.itext.trim() ? '' : 'disabled'}>메모 저장</button>
    ${fi.length ? `<ul class="ilist">${fi.map(i => `<li class="${i.done ? 'done' : ''}"><span>${esc(issueLine(i))}${i.done ? ' (해결)' : ''}</span>
      ${i.done ? `<button class="del" data-di="${i.id}">삭제</button>` : `<button class="ok" data-ok="${i.id}">해결</button>`}</li>`).join('')}</ul>` : ''}
  </div>`;
  h += '<button class="close" id="btnClose">닫기</button>';
  $('sheet').innerHTML = h;

  $('sheet').querySelectorAll('[data-it]').forEach(b => b.onclick = () => { sel.itype = sel.itype === b.dataset.it ? null : b.dataset.it; renderSheet(); });
  $('itext').oninput = e => { sel.itext = e.target.value; $('btnIssue').disabled = !(sel.itype || sel.itext.trim()); };
  $('btnIssue').onclick = async () => {
    const r = await call({ action: 'issue', field: f.name, type: sel.itype || '기타', text: sel.itext.trim() });
    if (r) { sel.itype = null; sel.itext = ''; renderSheet(); }
  };
  $('sheet').querySelectorAll('[data-ok]').forEach(b => b.onclick = () => call({ action: 'resolve', id: b.dataset.ok }));
  $('sheet').querySelectorAll('[data-di]').forEach(b => b.onclick = () => { if (confirm('이 메모를 삭제할까요?')) call({ action: 'delIssue', id: b.dataset.di }); });

  $('sheet').querySelectorAll('[data-r]').forEach(b => b.onclick = () => { sel.round = +b.dataset.r; sel.seg = null; renderSheet(); });
  $('sheet').querySelectorAll('[data-s]').forEach(b => b.onclick = () => { sel.seg = b.dataset.s; renderSheet(); });
  $('sheet').querySelectorAll('[data-p]').forEach(b => b.onclick = () => { sel.plan = +b.dataset.p; renderSheet(); });
  $('sheet').querySelectorAll('[data-ext]').forEach(b => b.onclick = () => {
    alerted.delete(info.running.id + 's'); alerted.delete(info.running.id + 'o');
    call({ action: 'plan', id: info.running.id, plan: info.running.plan + Number(b.dataset.ext) });
  });
  $('sheet').querySelectorAll('.del').forEach(b => b.onclick = () => {
    if (confirm('이 기록을 삭제할까요? 구글시트에서도 지워집니다.')) call({ action: 'remove', id: b.dataset.id });
  });
  $('btnClose').onclick = closeSheet;
  if ($('btnStart')) $('btnStart').onclick = () => call({ action: 'start', field: f.name, round: sel.round, seg: sel.seg, plan: sel.plan });
  if ($('btnEnd')) $('btnEnd').onclick = () => call({ action: 'end', id: info.running.id });
}

function renderSetup() {
  $('sheet').innerHTML = `<div class="setup">
    <h2>구글시트 연결</h2>
    <div class="memo">Apps Script에서 배포한 웹 앱 URL(…/exec로 끝나는 주소)을 붙여넣어 주세요. 이 기기에만 저장됩니다.</div>
    <input id="apiInput" type="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(api)}">
    <button class="big start" id="saveApi">연결 저장</button>
    <button class="close" id="btnClose">닫기</button></div>`;
  $('sheet').classList.add('open');
  $('sheetBg').style.display = 'block';
  $('btnClose').onclick = closeSheet;
  $('saveApi').onclick = () => {
    api = $('apiInput').value.trim();
    try { localStorage.setItem('waterApi', api); } catch (e) {}
    closeSheet(); call();
  };
}

/* ============ 도우미 ============ */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
let tt; function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 3500); }
function shiftDate(n) {
  const d = new Date(($('date').value || state.today) + 'T00:00:00'); d.setDate(d.getDate() + n);
  $('date').value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  call();
}

$('date').onchange = () => call();
$('prev').onclick = () => shiftDate(-1);
$('next').onclick = () => shiftDate(1);
$('goToday').onclick = () => { $('date').value = ''; call(); };
$('btnReload').onclick = () => call();
$('btnSetup').onclick = renderSetup;
$('sheetBg').onclick = closeSheet;

// 남은 시간: 15초마다 화면만 다시 계산 / 서버 기록: 1분마다 새로 불러오기
setInterval(() => { if (state.date && state.date === state.today && state.records.some(r => !r.end)) render(); }, 15000);
setInterval(() => { if (state.date && state.date === state.today && document.visibilityState === 'visible') call(); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && state.date === state.today) call(); });
call();
</script>
</body>
</html>
